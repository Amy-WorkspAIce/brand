<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amy-WorkspAIce</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--night-000); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .solar { fill:var(--solar); }
  .sunset { fill:var(--sunset); }
  .magenta { fill:var(--magenta); }
  .cyan { fill:var(--cyan); }
  .plus { stroke:var(--magenta); stroke-width:2; fill:none; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:64px; line-height:.95; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="480 0 480 288" width="480" height="288">
<!--
  blocks      solar 328×88 bled off the top · sunset 336×40 · magenta 344×60 (the brand: the widest band) · cyan 480×12 horizon (Amy) — together ≈25% of 960×288
  arrangement a strip of unequal bands stacked as a sun setting off the right edge: left edges follow one circle (r 440, centre 1060,216) snapped to space-2, slices between them thicken downward
  pattern     plus grid, from "4px grid" and the HUD/mono readouts: the grid floor under the horizon, magenta pluses at a space-6 pitch, 2 rows × 19
  scales      gaps space-2, space-3, space-2; horizon space-3 tall; plus arms space-2; pitch space-6; corners radius-0, one cut-lg chamfer on the magenta band
-->
